version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: agriconnect-postgres
    environment:
      POSTGRES_USER: agriconnect
      POSTGRES_PASSWORD: agriconnect2024
      POSTGRES_DB: agriconnect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agriconnect-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agriconnect"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and queues
  redis:
    image: redis:7-alpine
    container_name: agriconnect-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - agriconnect-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agriconnect-api
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: agriconnect
      DATABASE_PASSWORD: agriconnect2024
      DATABASE_NAME: agriconnect
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: your-super-secret-jwt-key-change-this
      JWT_REFRESH_SECRET: your-super-secret-refresh-key-change-this
      ADMIN_EMAIL: admin@agriconnect.com
      ADMIN_PASSWORD: admin123
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agriconnect-network
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  # Adminer for database management (optional)
  adminer:
    image: adminer:latest
    container_name: agriconnect-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - agriconnect-network
    restart: unless-stopped

networks:
  agriconnect-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads: